<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#f4bf4f"/>
      <stop offset="1" stop-color="#bd6e2b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dy="22" result="offset"/>
      <feColorMatrix in="offset" values="0 0 0 0 0.02 0 0 0 0 0.01 0 0 0 0 0.06 0 0 0 .72 0" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(512 510) rotate(-7) scale(.78)" filter="url(#shadow)">
    <path d="M0-347 31-280 105-272 51-221 65-148 0-183-65-148-51-221-105-272-31-280Z" fill="#f7d676"/>
    <rect x="-230" y="-315" width="460" height="630" rx="58" fill="#15102c" stroke="url(#gold)" stroke-width="27"/>
    <rect x="-192" y="-277" width="384" height="554" rx="39" fill="none" stroke="#a875d1" stroke-width="12"/>
    <path d="M0-128c-148 0-238 116-238 190S-148 252 0 252 238 136 238 62 148-128 0-128Z" fill="#251944" stroke="#f4bf4f" stroke-width="20"/>
    <path d="M0-72c-93 0-154 72-154 134S-93 196 0 196 154 124 154 62 93-72 0-72Z" fill="#f6d77d"/>
    <circle cy="62" r="88" fill="#6b4b96"/>
    <circle cx="28" cy="34" r="25" fill="#d9f7ff"/>
  </g>

  <g fill="#73e3db" filter="url(#cyanGlow)">
    <ellipse cx="786" cy="267" rx="28" ry="43" transform="rotate(145 786 267)"/>
    <circle cx="826" cy="312" r="14"/>
    <circle cx="809" cy="336" r="12"/>
    <circle cx="782" cy="343" r="11"/>
    <ellipse cx="237" cy="746" rx="28" ry="43" transform="rotate(-34 237 746)"/>
    <circle cx="198" cy="701" r="14"/>
    <circle cx="216" cy="678" r="12"/>
    <circle cx="243" cy="671" r="11"/>
  </g>
</svg>
